<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel · Sistema en Producción · BATIN</title>
  <script>try{if(localStorage.getItem('batin-tema')==='claro')document.documentElement.dataset.tema='claro'}catch(e){}</script>
  <link rel="stylesheet" href="../../batin.css">
  <link rel="stylesheet" href="sp.css">
  <style>
    #sp .pn { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }
    #sp .pn-fuente { display: inline-flex; border: 1px solid var(--borde3); border-radius: var(--r); overflow: hidden; }
    #sp .pn-fuente button { background: var(--bg3); color: var(--texto2); border: none; padding: 9px 14px; font-family: var(--font-mono); font-size: 12px; font-weight: 700; }
    #sp .pn-fuente button.act { background: var(--naranja); color: #fff; }
    #sp .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 18px; }
    #sp .kpi { background: var(--bg2); border: 1px solid var(--borde2); border-radius: var(--r2); padding: 16px 18px; }
    #sp .kpi .v { font-family: var(--font-title); font-size: 28px; font-weight: 800; color: var(--texto-fuerte); line-height: 1.1; }
    #sp .kpi .l { font-size: 12px; color: var(--texto2); margin-top: 4px; }
    #sp .tabla { width: 100%; border-collapse: collapse; font-size: 14px; }
    #sp .tabla th, #sp .tabla td { padding: 9px 10px; border-bottom: 1px solid var(--borde2); text-align: left; vertical-align: middle; }
    #sp .tabla th { font-family: var(--font-mono); font-size: 10px; color: var(--texto2); text-transform: uppercase; letter-spacing: 1px; }
    #sp .tabla td.num { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
    #sp .tabla tr:hover td { background: var(--bg3); }
    #sp .barra { display: grid; grid-template-columns: 1fr 46px; gap: 8px; align-items: center; min-width: 160px; }
    #sp .barra .p { height: 10px; background: var(--bg4); border-radius: 0 4px 4px 0; position: relative; }
    #sp .barra .p i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--naranja); border-radius: 0 4px 4px 0; }
    #sp .barra .p .m { position: absolute; top: -3px; bottom: -3px; left: 60%; border-left: 2px dashed var(--texto3); }
    #sp .barra span { font-family: var(--font-mono); font-size: 12px; text-align: right; }
    #sp .q-mal { display: block; color: var(--texto2); font-size: 12px; margin-top: 3px; font-family: var(--font-mono); white-space: pre-wrap; }
    #sp .nota { font-size: 12px; color: var(--texto3); margin-top: 10px; }
    #sp .scroll-x { overflow-x: auto; }
    #sp .vacio { padding: 36px 20px; text-align: center; color: var(--texto2); }
    #sp .prog { display: flex; gap: 3px; }
    #sp .prog i { width: 14px; height: 14px; border-radius: 3px; background: var(--bg4); border: 1px solid var(--borde3); }
    #sp .prog i.si { background: var(--naranja); border-color: var(--naranja); }
  </style>
</head>
<body data-page="construyendo">
  <div id="batin-nav"></div>
  <div class="breadcrumb">
    <a href="../../construyendo.html">Estoy construyendo</a><span class="sep">/</span>
    <a href="index.html">Sistema en Producción</a><span class="sep">/</span>
    <span>Panel</span>
  </div>

  <main id="sp">
    <div class="pn">
      <div class="e-fila" style="justify-content:space-between;align-items:center">
        <span class="e-kicker">BATIN · Sistema en Producción · para la profe</span>
        <a class="e-btn sm" href="index.html">← Volver al juego</a>
      </div>
      <h1 class="e-h1">Panel del escape room</h1>
      <p class="e-lead">En qué capa del sistema se traban los equipos: qué salas cuestan más, qué retos necesitan más intentos y qué respuestas equivocadas se repiten.</p>

      <div class="e-card">
        <div class="e-fila">
          <label class="e-campo">Datos de
            <span class="pn-fuente" role="group" aria-label="Fuente de datos">
              <button type="button" data-fuente="local" class="act">Este navegador</button>
              <button type="button" data-fuente="remoto">Planilla de Google</button>
            </span>
          </label>
          <label class="e-campo oculto" id="f-clave-box">Clave del panel<input type="text" id="f-clave" autocomplete="off"></label>
          <button class="e-btn sm oculto" id="f-cargar" type="button">Cargar</button>
          <label class="e-campo">Curso<select id="f-curso"><option value="">Todos</option></select></label>
        </div>
        <div class="nota" id="f-estado"></div>
      </div>

      <div id="pn-equipos"></div>
      <div id="pn-cuerpo"></div>

      <div class="e-fila" style="margin-top:26px;justify-content:space-between">
        <button class="e-btn sm" id="b-borrar" type="button">🗑 Borrar todo lo guardado en este navegador</button>
        <button class="e-btn sm" id="b-csv" type="button">⬇ Descargar CSV</button>
      </div>
    </div>
  </main>

  <div id="batin-footer"></div>

  <script src="../../batin.js"></script>
  <script src="config.js"></script>
  <script src="salas.js"></script>
  <script src="registro.js"></script>
  <script>
  (function () {
    'use strict';
    var REG = window.SpRegistro, CFG = window.SP_CONFIG || {};
    var SALAS = (window.SP_SALAS || []).filter(function (s) { return !s.opcional || CFG[s.opcional]; });
    var porSala = {}, porReto = {};
    (window.SP_SALAS || []).forEach(function (s) { porSala[s.id] = s; s.retos.forEach(function (r) { porReto[r.id] = { r: r, s: s }; }); });
    var fuente = 'local', todas = [];
    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
    function mmss(ms) { var s = Math.floor((ms || 0) / 1000), m = Math.floor(s / 60); return m + ':' + ('0' + (s % 60)).slice(-2); }

    function llenarCursos() {
      var sel = el('f-curso'), act = sel.value, c = {};
      todas.forEach(function (f) { if (f.curso) c[f.curso] = 1; });
      var eqs = REG.partidas.todas(); Object.keys(eqs).forEach(function (k) { if (eqs[k].curso) c[eqs[k].curso] = 1; });
      sel.innerHTML = '<option value="">Todos</option>' + Object.keys(c).sort().map(function (x) { return '<option' + (x === act ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
    }
    function filtradas() { var c = el('f-curso').value; return todas.filter(function (f) { return !c || f.curso === c; }); }

    function cargarLocal() {
      todas = REG.filasLocales();
      el('f-estado').textContent = 'Resultados registrados en esta computadora.' + (REG.hayEndpoint() && REG.pendientes() ? ' Hay ' + REG.pendientes() + ' salas esperando para enviarse a la planilla.' : '');
      llenarCursos(); pintar();
    }
    function cargarRemoto() {
      if (!REG.hayEndpoint()) { el('f-estado').textContent = 'Todavía no hay endpoint en config.js. Ver LEEME.md.'; todas = []; pintar(); return; }
      el('f-estado').textContent = 'Cargando desde la planilla…';
      REG.filasRemotas(el('f-clave').value.trim()).then(function (f) {
        todas = f; try { sessionStorage.setItem('batin_sp3_clave', el('f-clave').value.trim()); } catch (e) {}
        el('f-estado').textContent = 'Datos de la planilla: todas las computadoras.'; llenarCursos(); pintar();
      }).catch(function (e) { el('f-estado').textContent = 'No se pudo leer la planilla: ' + e.message; todas = []; pintar(); });
    }
    try { el('f-clave').value = sessionStorage.getItem('batin_sp3_clave') || ''; } catch (e) {}
    Array.prototype.forEach.call(document.querySelectorAll('[data-fuente]'), function (b) {
      b.addEventListener('click', function () {
        fuente = b.dataset.fuente;
        Array.prototype.forEach.call(document.querySelectorAll('[data-fuente]'), function (x) { x.classList.toggle('act', x === b); });
        el('f-clave-box').classList.toggle('oculto', fuente !== 'remoto'); el('f-cargar').classList.toggle('oculto', fuente !== 'remoto');
        if (fuente === 'local') cargarLocal(); else cargarRemoto();
      });
    });
    el('f-cargar').addEventListener('click', cargarRemoto);
    el('f-curso').addEventListener('change', pintar);

    function barra(p) { return '<div class="barra"><div class="p"><i style="width:' + p + '%"></i><span class="m"></span></div><span>' + p + '%</span></div>'; }

    function pintarEquipos() {
      var box = el('pn-equipos');
      if (fuente !== 'local') { box.innerHTML = ''; return; }
      var c = el('f-curso').value, eqs = REG.partidas.todas();
      var lista = Object.keys(eqs).map(function (k) { return eqs[k]; }).filter(function (p) { return !c || p.curso === c; })
        .sort(function (a, b) { return (b.hechas || []).length - (a.hechas || []).length || (b.puntos || 0) - (a.puntos || 0); });
      if (!lista.length) { box.innerHTML = ''; return; }
      box.innerHTML = '<div class="e-card"><h3>Equipos en esta computadora</h3><div class="scroll-x"><table class="tabla"><thead><tr><th>Equipo</th><th>Curso</th><th>Salas</th><th class="num">Tiempo</th><th class="num">Puntos</th><th>Estado</th></tr></thead><tbody>' +
        lista.map(function (p) {
          return '<tr><td><b>' + esc(p.equipo) + '</b></td><td>' + esc(p.curso) + '</td><td><span class="prog">' + SALAS.map(function (s) { return '<i class="' + ((p.hechas || []).indexOf(s.id) >= 0 ? 'si' : '') + '" title="' + esc(s.nombre) + '"></i>'; }).join('') + '</span></td>' +
            '<td class="num">' + mmss(p.ms) + '</td><td class="num">' + (p.puntos || 0) + '</td><td>' + (p.terminada ? '🚀 terminado' : 'en curso') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }

    function pintar() {
      pintarEquipos();
      var filas = filtradas(), cuerpo = el('pn-cuerpo');
      if (!filas.length) { cuerpo.innerHTML = '<div class="e-card vacio">Todavía no hay salas terminadas con estos filtros.<br>Cada vez que un equipo termina una sala, sus resultados aparecen acá.</div>'; return; }
      var eqs = {}; filas.forEach(function (f) { eqs[f.equipo + '|' + f.curso] = 1; });
      var primera = filas.filter(function (f) { return f.ok; }).length;
      var pistas = filas.filter(function (f) { return String(f.elegida || '').indexOf('[pista]') === 0; }).length;
      var prom = filas.reduce(function (a, f) { return a + (Number(f.n) || 1); }, 0) / filas.length;
      var h = '<div class="kpis">' +
        kpi(Object.keys(eqs).length, 'equipos') + kpi(filas.length, 'retos resueltos') +
        kpi(pct(primera, filas.length) + '%', 'resueltos al primer intento') + kpi(prom.toFixed(1), 'intentos por reto (promedio)') + kpi(pistas, 'pistas pedidas') + '</div>';

      // Por sala
      h += '<div class="e-card"><h3>Por sala · capa del sistema</h3><div class="scroll-x"><table class="tabla"><thead><tr><th>Sala</th><th>Al primer intento</th><th class="num">Intentos prom.</th><th class="num">Pistas</th><th class="num">Retos</th></tr></thead><tbody>' +
        (window.SP_SALAS || []).map(function (s) {
          var fs = filas.filter(function (f) { return f.tema === s.id; });
          if (!fs.length) return '';
          var ok = fs.filter(function (f) { return f.ok; }).length;
          var ip = fs.reduce(function (a, f) { return a + (Number(f.n) || 1); }, 0) / fs.length;
          var pi = fs.filter(function (f) { return String(f.elegida || '').indexOf('[pista]') === 0; }).length;
          return '<tr><td>' + s.ico + ' <b>' + s.n + '. ' + esc(s.nombre) + '</b><br><small style="color:var(--texto3)">' + esc(s.area) + '</small></td><td>' + barra(pct(ok, fs.length)) + '</td><td class="num">' + ip.toFixed(1) + '</td><td class="num">' + pi + '</td><td class="num">' + fs.length + '</td></tr>';
        }).join('') + '</tbody></table></div><p class="nota">La línea punteada marca 60 %. Una sala muy por debajo indica la capa donde conviene repasar antes de la defensa.</p></div>';

      // Retos más difíciles
      var g = {};
      filas.forEach(function (f) { var x = g[f.qid] || (g[f.qid] = { qid: f.qid, tot: 0, int: 0, ok: 0, malas: {} }); x.tot++; x.int += Number(f.n) || 1; if (f.ok) x.ok++; var e = String(f.elegida || '').replace(/^\[pista\] /, ''); if (e) x.malas[e] = (x.malas[e] || 0) + 1; });
      var dif = Object.keys(g).map(function (k) { return g[k]; }).filter(function (x) { return x.int > x.tot; })
        .sort(function (a, b) { return b.int / b.tot - a.int / a.tot || b.tot - a.tot; }).slice(0, 10);
      h += '<div class="e-card"><h3>Retos que más intentos necesitaron</h3>' + (dif.length ? '<div class="scroll-x"><table class="tabla"><thead><tr><th>Reto</th><th class="num">Intentos prom.</th><th class="num">Al 1.º</th></tr></thead><tbody>' +
        dif.map(function (x) {
          var info = porReto[x.qid] || {}, r = info.r || {}, s = info.s || {};
          var top = Object.keys(x.malas).sort(function (a, b) { return x.malas[b] - x.malas[a]; })[0];
          return '<tr><td><small style="color:var(--texto3)">' + esc(x.qid) + ' · ' + esc(s.nombre || '') + '</small><br>' + esc(r.q || '(ya no está en salas.js)') +
            (top ? '<span class="q-mal">Primera respuesta equivocada más común: ' + esc(top) + (x.malas[top] > 1 ? ' (' + x.malas[top] + ' equipos)' : '') + '</span>' : '') +
            '</td><td class="num">' + (x.int / x.tot).toFixed(1) + '</td><td class="num">' + pct(x.ok, x.tot) + '%</td></tr>';
        }).join('') + '</tbody></table></div>' : '<p class="nota">Todos los retos se resolvieron al primer intento.</p>') + '</div>';
      cuerpo.innerHTML = h;
    }
    function kpi(v, l) { return '<div class="kpi"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }

    el('b-csv').addEventListener('click', function () {
      var f = filtradas(); if (!f.length) { alert('No hay datos para descargar.'); return; }
      var cols = [['fecha', 'fecha'], ['curso', 'curso'], ['equipo', 'equipo'], ['tema', 'sala'], ['qid', 'reto'], ['sub', 'subtema'], ['n', 'intentos'], ['ok', 'primer_intento'], ['elegida', 'primera_respuesta_equivocada']];
      var csv = '﻿' + cols.map(function (c) { return c[1]; }).join(';') + '\n' + f.map(function (x) {
        return cols.map(function (c) { var v = c[0] === 'ok' ? (x.ok ? 1 : 0) : (x[c[0]] == null ? '' : x[c[0]]); return '"' + String(v).replace(/"/g, '""') + '"'; }).join(';');
      }).join('\n');
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = 'escape-room-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
    });
    el('b-borrar').addEventListener('click', function () {
      if (!confirm('¿Borrar TODO lo guardado en este navegador (partidas en curso y resultados)? Lo enviado a la planilla no se borra.')) return;
      REG.borrarTodo(); cargarLocal();
    });

    if (REG.pendientes()) REG.enviarPendientes();
    cargarLocal();
  })();
  </script>
</body>
</html>
