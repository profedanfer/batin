<!-- ================= TEORÍA ================= -->
<section class="view t-azul" id="v-teoria">
  <div class="sec-head">
    <p class="eyebrow">Teoría</p>
    <h2>Todo lo que necesitas antes de jugar</h2>
    <p>Lee cada bloque y prueba los ejemplos: todos los árboles de esta parte se pueden tocar.</p>
  </div>

  <div class="block">
    <h3><span class="k">1</span>¿Qué es un árbol?</h3>
    <div class="prose">
      <p>Un <b>árbol</b> es una estructura de datos <b>no lineal y jerárquica</b>. Los datos se guardan en <b>nodos</b> conectados de arriba hacia abajo, como un árbol dado vuelta: la raíz arriba y las hojas abajo.</p>
      <p>En una lista o un vector cada elemento tiene un solo “siguiente”. En un árbol, cada nodo puede tener varios <b>hijos</b>, pero un solo <b>padre</b>.</p>
    </div>
    <ul class="chips">
      <li>Carpetas de tu compu</li><li>Organigrama del colegio</li><li>Árbol genealógico</li><li>Llaves de un torneo</li><li>Menús de una app</li><li>El HTML de una página (DOM)</li>
    </ul>
    <div class="split">
      <div class="stage">
        <div class="tree-box"><svg id="fold-svg" class="tree" aria-label="Árbol de carpetas del sitio BATIN"></svg></div>
        <p class="legend"><span><i style="border-color:var(--azul)"></i>nodo elegido</span><span><i style="border-color:var(--naranja)"></i>su padre</span><span><i style="border-color:var(--violeta)"></i>sus hijos</span></p>
      </div>
      <div class="panel" id="fold-info" aria-live="polite">
        <p class="meta">Ficha del nodo</p>
        <p>Toca cualquier carpeta o archivo para ver su ficha.</p>
      </div>
    </div>
  </div>

  <div class="block">
    <h3><span class="k">2</span>Vocabulario</h3>
    <dl class="vocab">
      <div><dt>Raíz</dt><dd>El nodo de arriba de todo. Es el único que no tiene padre.</dd></div>
      <div><dt>Nodo</dt><dd>Cada elemento del árbol. Guarda un dato y los enlaces a sus hijos.</dd></div>
      <div><dt>Arista (rama)</dt><dd>La conexión entre un padre y un hijo. Con <i>n</i> nodos hay <i>n − 1</i> aristas.</dd></div>
      <div><dt>Padre e hijo</dt><dd>Si B está conectado justo debajo de A, A es el padre de B y B es hijo de A.</dd></div>
      <div><dt>Hermanos</dt><dd>Nodos que tienen el mismo padre.</dd></div>
      <div><dt>Hoja</dt><dd>Nodo sin hijos. Está en el borde de abajo del árbol.</dd></div>
      <div><dt>Nodo interno</dt><dd>Nodo con al menos un hijo (todos los que no son hojas).</dd></div>
      <div><dt>Subárbol</dt><dd>Un nodo junto con todos sus descendientes. Cada hijo es la raíz de su propio subárbol.</dd></div>
      <div><dt>Nivel (profundidad)</dt><dd>Cantidad de aristas desde la raíz hasta el nodo. La raíz está en el nivel 0.</dd></div>
      <div><dt>Altura</dt><dd>El nivel de la hoja más profunda. Un árbol de un solo nodo tiene altura 0.</dd></div>
      <div><dt>Grado</dt><dd>Cantidad de hijos de un nodo. El grado del árbol es el mayor grado de sus nodos.</dd></div>
    </dl>
    <div class="say" data-who="gatiel"><p>Algunos libros cuentan los niveles desde 1. Aquí contamos desde 0. Antes de responder un examen, fíjate qué convención usa.</p>
      <details><summary>Pregunta trampa: un árbol tiene 10 nodos. ¿Cuántas aristas tiene?</summary><p>9. Cada nodo, menos la raíz, tiene exactamente un padre, y cada uno de esos enlaces es una arista.</p></details>
    </div>
  </div>

  <div class="block">
    <h3><span class="k">3</span>Árbol binario</h3>
    <div class="prose">
      <p>Un <b>árbol binario</b> es un árbol donde cada nodo tiene <b>como máximo dos hijos</b>, y además importa cuál es cuál: el <b>hijo izquierdo</b> y el <b>hijo derecho</b>. Un nodo con un solo hijo a la izquierda no es el mismo árbol que uno con ese hijo a la derecha.</p>
    </div>
    <div class="types">
      <figure><div class="tree-box"><svg id="bt-perf" class="tree"></svg></div><figcaption><b>Perfecto (lleno)</b><br>Todos los niveles están completos.</figcaption></figure>
      <figure><div class="tree-box"><svg id="bt-comp" class="tree"></svg></div><figcaption><b>Completo</b><br>Todos los niveles llenos menos el último, que se llena de izquierda a derecha.</figcaption></figure>
      <figure><div class="tree-box"><svg id="bt-deg" class="tree"></svg></div><figcaption><b>Degenerado</b><br>Cada nodo tiene un solo hijo: en la práctica es una lista.</figcaption></figure>
    </div>
    <div class="prose">
      <p>Dos cuentas útiles: en el nivel <i>k</i> caben como máximo <b>2<sup>k</sup></b> nodos, y un árbol binario de altura <i>h</i> tiene como máximo <b>2<sup>h+1</sup> − 1</b> nodos. Con altura 3 eso da 15.</p>
    </div>
  </div>

  <div class="block">
    <h3><span class="k">4</span>Recorridos</h3>
    <div class="prose">
      <p><b>Recorrer</b> un árbol es visitar todos sus nodos una sola vez. Como el árbol no es una fila, hay varias formas de hacerlo. Las tres primeras son <b>en profundidad</b> y recursivas: cada subárbol se recorre con la misma regla. La cuarta es <b>en anchura</b> y usa una cola.</p>
    </div>
    <div class="tbl-box"><table>
      <thead><tr><th>Recorrido</th><th>Regla</th><th>Para qué sirve</th></tr></thead>
      <tbody>
        <tr><td><b>Preorden</b></td><td>Raíz → Izquierda → Derecha</td><td>Copiar un árbol, mostrar carpetas con sangría</td></tr>
        <tr><td><b>Inorden</b></td><td>Izquierda → Raíz → Derecha</td><td>En un ABB devuelve los datos ordenados</td></tr>
        <tr><td><b>Postorden</b></td><td>Izquierda → Derecha → Raíz</td><td>Calcular tamaños, borrar un árbol, evaluar expresiones</td></tr>
        <tr><td><b>Por niveles</b></td><td>Nivel 0, nivel 1, nivel 2… de izquierda a derecha</td><td>Organigramas, el camino más corto en pasos</td></tr>
      </tbody>
    </table></div>
    <div class="stage t-violeta">
      <div class="row" style="justify-content:space-between">
        <div class="seg" id="play-types" role="group" aria-label="Tipo de recorrido">
          <button data-type="pre" aria-pressed="true">Preorden</button><button data-type="ino" aria-pressed="false">Inorden</button><button data-type="post" aria-pressed="false">Postorden</button><button data-type="lev" aria-pressed="false">Por niveles</button>
        </div>
        <div class="row"><button class="btn" id="play-step">Paso</button><button class="btn ghost" id="play-btn">Reproducir</button><button class="btn ghost" id="play-reset">Reiniciar</button></div>
      </div>
      <div class="tree-box"><svg id="play-svg" class="tree" aria-label="Árbol de ejemplo para recorridos"></svg></div>
      <div class="strip" id="play-seq" aria-live="polite"></div>
      <p class="msg" id="play-msg"></p>
      <div class="queue" id="play-queue"></div>
    </div>
    <div class="say" data-who="bit"><p><b>Truco del contorno.</b> Dibuja una línea que rodee todo el árbol, empezando por la izquierda de la raíz y bajando por las ramas. Si anotas cada nodo cuando pasas por <b>su izquierda</b>, sale el preorden; cuando pasas <b>por debajo</b>, el inorden; cuando pasas por <b>su derecha</b>, el postorden.</p></div>
  </div>

  <div class="block">
    <h3><span class="k">5</span>Árbol binario de búsqueda (ABB)</h3>
    <div class="prose">
      <p>Un <b>ABB</b> es un árbol binario con una regla de orden: para cada nodo, <b>todo su subárbol izquierdo es menor</b> y <b>todo su subárbol derecho es mayor</b>. No alcanza con mirar al padre: la regla vale para todos los descendientes.</p>
      <p><b>Buscar</b> un valor: empiezas en la raíz y comparas. Si es igual, lo encontraste. Si es menor, bajas a la izquierda; si es mayor, a la derecha. Si llegas a un lugar vacío, el valor no está.</p>
      <p><b>Insertar</b> es buscar el valor y, en el lugar vacío donde termina la búsqueda, colgar el nodo nuevo.</p>
    </div>
    <div class="stage">
      <div class="tree-box"><svg id="abb-svg" class="tree" aria-label="Árbol binario de búsqueda de ejemplo"></svg></div>
      <div class="row">
        <label for="abb-num">Número</label><input id="abb-num" type="number" min="1" max="999" value="35">
        <button class="btn" id="abb-search" type="button">Buscar</button>
        <button class="btn ghost" id="abb-insert" type="button">Insertar</button>
        <button class="btn ghost" id="abb-reset" type="button">Reiniciar</button>
        <button class="btn ghost" id="abb-worst" type="button">Peor caso</button>
      </div>
      <ol class="log" id="abb-log" aria-live="polite"></ol>
    </div>
    <div class="say" data-who="gatiel"><p>¿Qué pasa si insertas 10, 20, 30, 40, 50, 60 en ese orden? Toca <b>Peor caso</b> y mira. Un ABB es rápido solo si está más o menos <b>balanceado</b>.</p></div>
    <div class="tbl-box"><table>
      <thead><tr><th>Datos guardados</th><th>Lista sin orden (peor caso)</th><th>ABB balanceado (peor caso)</th></tr></thead>
      <tbody>
        <tr><td class="num">15</td><td class="num">15 comparaciones</td><td class="num">4 comparaciones</td></tr>
        <tr><td class="num">1.000</td><td class="num">1.000</td><td class="num">10</td></tr>
        <tr><td class="num">1.000.000</td><td class="num">1.000.000</td><td class="num">20</td></tr>
      </tbody>
    </table></div>
    <div class="prose"><p>Cada comparación en un ABB balanceado descarta la mitad del árbol. Por eso la cantidad de pasos crece como log<sub>2</sub>(n): 2<sup>20</sup> ya pasa el millón. Además, <b>el inorden de un ABB siempre sale ordenado</b> de menor a mayor.</p></div>
  </div>

  <div class="block">
    <h3><span class="k">6</span>Del dibujo al código</h3>
    <div class="seg" id="code-tabs" role="group" aria-label="Lenguaje">
      <button data-code="pseudo" aria-pressed="true">Pseudocódigo</button><button data-code="java" aria-pressed="false">Java</button>
    </div>
<pre id="code-pseudo"><span class="k">Procedimiento</span> Preorden(nodo)
    <span class="k">Si</span> nodo &lt;&gt; NULO <span class="k">Entonces</span>
        <span class="k">Escribir</span> nodo.dato        <span class="c">// 1. raíz</span>
        Preorden(nodo.izq)        <span class="c">// 2. izquierda</span>
        Preorden(nodo.der)        <span class="c">// 3. derecha</span>
    <span class="k">FinSi</span>
<span class="k">FinProcedimiento</span>
<span class="c">// Inorden: mueve el Escribir entre las dos llamadas.</span>
<span class="c">// Postorden: mueve el Escribir al final.</span>

<span class="k">Funcion</span> encontrado &lt;- BuscarABB(nodo, x)
    encontrado &lt;- Falso
    <span class="k">Mientras</span> nodo &lt;&gt; NULO Y NO encontrado <span class="k">Hacer</span>
        <span class="k">Si</span> x = nodo.dato <span class="k">Entonces</span>
            encontrado &lt;- Verdadero
        <span class="k">SiNo</span>
            <span class="k">Si</span> x &lt; nodo.dato <span class="k">Entonces</span>
                nodo &lt;- nodo.izq
            <span class="k">SiNo</span>
                nodo &lt;- nodo.der
            <span class="k">FinSi</span>
        <span class="k">FinSi</span>
    <span class="k">FinMientras</span>
<span class="k">FinFuncion</span></pre>
<pre id="code-java" hidden><span class="c">// Cada nodo guarda un dato y dos referencias: izquierda y derecha.</span>
<span class="k">class</span> Nodo {
    <span class="k">int</span> dato;
    Nodo izq, der;
    Nodo(<span class="k">int</span> dato) { <span class="k">this</span>.dato = dato; }
}

<span class="k">public class</span> ArbolABB {
    <span class="k">static</span> Nodo insertar(Nodo n, <span class="k">int</span> x) {
        <span class="k">if</span> (n == <span class="k">null</span>) <span class="k">return new</span> Nodo(x);   <span class="c">// lugar vacío: va aquí</span>
        <span class="k">if</span> (x &lt; n.dato) n.izq = insertar(n.izq, x);
        <span class="k">else if</span> (x &gt; n.dato) n.der = insertar(n.der, x);
        <span class="k">return</span> n;
    }
    <span class="k">static void</span> inorden(Nodo n) {
        <span class="k">if</span> (n == <span class="k">null</span>) <span class="k">return</span>;
        inorden(n.izq);
        System.out.print(n.dato + " ");
        inorden(n.der);
    }
    <span class="k">static boolean</span> buscar(Nodo n, <span class="k">int</span> x) {
        <span class="k">while</span> (n != <span class="k">null</span>) {
            <span class="k">if</span> (x == n.dato) <span class="k">return true</span>;
            n = (x &lt; n.dato) ? n.izq : n.der;
        }
        <span class="k">return false</span>;
    }
    <span class="k">public static void</span> main(String[] args) {
        Nodo raiz = <span class="k">null</span>;
        <span class="k">int</span>[] datos = {50, 30, 70, 20, 40, 60, 80};
        <span class="k">for</span> (<span class="k">int</span> d : datos) raiz = insertar(raiz, d);
        inorden(raiz);                         <span class="c">// 20 30 40 50 60 70 80</span>
        System.out.println();
        System.out.println(buscar(raiz, 60));  <span class="c">// true</span>
    }
}</pre>

function randomBin(labels,maxH){let root;for(let t=0;t<300;t++){root=N(labels[0]);const slots=[[root,'l'],[root,'r']];for(let i=1;i<labels.length;i++){const k=rand(slots.length);const s=slots.splice(k,1)[0];const c=N(labels[i]);s[0][s[1]]=c;slots.push([c,'l'],[c,'r']);}if(T.h(root)<=maxH&&T.h(root)>=2)return root;}return root;}
function bstInsert(root,v){const n=N(v);if(!root)return n;let p=root;for(;;){if(v<p.v){if(!p.l){p.l=n;break;}p=p.l;}else{if(!p.r){p.r=n;break;}p=p.r;}}return root;}
function buildBST(arr){let r=null;arr.forEach(v=>{r=bstInsert(r,v);});return r;}
function bstPath(root,v){const path=[];let p=root;while(p){path.push(p);if(v===p.v)return{path:path,found:true};p=v<p.v?p.l:p.r;}return{path:path,found:false};}
function bstSlot(root,v){let p=root;for(;;){if(v<p.v){if(!p.l)return{p:p,side:'l'};p=p.l;}else{if(!p.r)return{p:p,side:'r'};p=p.r;}}}

function cmpLine(x,n){return x===n.v?x+' = '+n.v+' → encontrado':x<n.v?x+' &lt; '+n.v+' → izquierda':x+' &gt; '+n.v+' → derecha';}

function layoutBin(root,ghosts){const items=[];let i=0;(function rec(n,d,par,side){if(!n){if(ghosts&&par)items.push({ghost:true,id:'g_'+par.id+'_'+side,parId:par.id,parent:par,side:side,x:i++,d:d});return;}rec(n.l,d+1,n,'l');items.push({node:n,id:n.id,label:String(n.v),x:i++,d:d,parId:par?par.id:null,side:side});rec(n.r,d+1,n,'r');})(root,0,null,null);return items;}
function layoutGen(root){const items=[];let leaf=0;(function rec(n,d,par){const it={node:n,id:n.id,label:String(n.v),d:d,parId:par?par.id:null};items.push(it);if(!n.kids.length){it.x=leaf++;}else{const ks=n.kids.map(k=>rec(k,d+1,n));it.x=(ks[0].x+ks[ks.length-1].x)/2;}return it;})(root,0,null);return items;}
function drawTree(svg,items,o){
 o=o||{};svg.innerHTML='';
 const dx=o.dx||54,dy=o.dy||66,r=o.r||19;
 const sizes=items.map(it=>{if(it.ghost)return{w:28,h:28};if(o.pill){const lines=it.label.split('\n');const L=Math.max.apply(null,lines.map(s=>s.length));return{w:Math.max(44,L*7.6+22),h:lines.length>1?42:32,lines:lines};}return{w:r*2,h:r*2};});
 const padX=Math.max(30,Math.max.apply(null,sizes.map(s=>s.w/2+8)));
 const padY=Math.max(28,Math.max.apply(null,sizes.map(s=>s.h/2+10)));
 let maxX=0,maxD=0;items.forEach(it=>{maxX=Math.max(maxX,it.x);maxD=Math.max(maxD,it.d);});
 const W=padX*2+maxX*dx,H=padY*2+maxD*dy;
 svg.setAttribute('viewBox','0 0 '+W+' '+H);
 svg.style.maxWidth=Math.round(W*(o.scale||1.25))+'px';
 svg.style.minWidth=o.minW?Math.min(W,o.minW)+'px':'';
 const pos={};
 items.forEach((it,i)=>{it.cx=padX+it.x*dx;it.cy=padY+it.d*dy;it.sz=sizes[i];pos[it.id]=it;});
 const ge=sv('g',null,svg),gl=sv('g',null,svg),gn=sv('g',null,svg);
 items.forEach(it=>{if(it.parId==null)return;const p=pos[it.parId];it.edge=sv('line',{x1:p.cx,y1:p.cy,x2:it.cx,y2:it.cy,'class':'edge'+(it.ghost?' ghost':'')},ge);
  if(o.edgeLabels&&!it.ghost&&it.side){const t=sv('text',{x:(p.cx+it.cx)/2+(it.side==='l'?-16:16),y:(p.cy+it.cy)/2-4,'class':'elabel'},gl);t.textContent=it.side==='l'?o.edgeLabels[0]:o.edgeLabels[1];}});
 items.forEach(it=>{const g=sv('g',{'class':'node'+(it.ghost?' ghostnode':''),transform:'translate('+it.cx+','+it.cy+')'},gn);it.g=g;const s=it.sz;
  if(it.ghost){sv('circle',{r:13},g);const t=sv('text',{dy:'.35em'},g);t.textContent='+';}
  else if(o.pill){sv('rect',{x:-s.w/2,y:-s.h/2,width:s.w,height:s.h,rx:s.h/2},g);if(s.lines.length>1){const t1=sv('text',{y:-3},g);t1.textContent=s.lines[0];const t2=sv('text',{y:13,'class':'sub'},g);t2.textContent=s.lines[1];}else{const t=sv('text',{dy:'.35em'},g);t.textContent=s.lines[0];}}
  else{sv('circle',{r:r},g);const t=sv('text',{dy:'.35em'},g);t.textContent=it.label;if(it.label.length>2)t.setAttribute('class','small');}
  if(o.onClick){g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',it.ghost?'Lugar vacío':'Nodo '+it.label.replace('\n',' '));g.classList.add('clickable');const fire=()=>o.onClick(it);g.addEventListener('click',fire);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fire();}});}
 });
 return pos;
}
function mark(pos,id,cls){const it=pos[id];if(it&&it.g)it.g.classList.add(cls);}

function strip(el,n){el.innerHTML='';for(let i=0;i<n;i++)el.appendChild(document.createElement('span'));}

const Q1={count:0,ok:0,root:null,q:null,sel:new Set(),done:false,last:null,pos:null};
const N1_TOTAL=9;
function n1Start(){Q1.count=0;Q1.ok=0;n1Next();}
function n1Gen(){
 const r=Q1.root,all=T.pre(r),par=T.parents(r),lv=leaves(r),internal=all.filter(n=>n.l||n.r),H=T.h(r);
 const nonroot=all.filter(n=>n!==r),withSib=nonroot.filter(n=>{const p=par[n.id];return p.l&&p.r;});
 const gens={
  raiz:()=>({t:'Toca la <b>raíz</b> del árbol.',mode:'one',ans:[r.id],exp:'La raíz es '+r.v+': el único nodo que no tiene padre.'}),
  hojas:()=>({t:'Toca <b>todas las hojas</b> y después presiona Comprobar.',mode:'many',ans:lv.map(n=>n.id),exp:'Las hojas son los nodos sin hijos: '+lv.map(n=>n.v).join(', ')+'.'}),
  padre:()=>{const x=pick(nonroot);const p=par[x.id];return{t:'Toca el <b>padre</b> de '+x.v+'.',mode:'one',focus:x.id,ans:[p.id],exp:p.v+' está justo arriba de '+x.v+', unido por una arista.'};},
  hijos:()=>{const x=pick(internal);const k=[x.l,x.r].filter(Boolean);return{t:'Toca <b>los hijos</b> de '+x.v+' y presiona Comprobar.',mode:'many',focus:x.id,ans:k.map(n=>n.id),exp:'Los hijos de '+x.v+' son '+k.map(n=>n.v).join(' y ')+'.'};},
  hermano:()=>{if(!withSib.length)return null;const x=pick(withSib);const p=par[x.id];const s=p.l===x?p.r:p.l;return{t:'Toca el <b>hermano</b> de '+x.v+'.',mode:'one',focus:x.id,ans:[s.id],exp:x.v+' y '+s.v+' son hermanos porque tienen el mismo padre: '+p.v+'.'};},
  nivel:()=>{const x=pick(nonroot);const d=T.depth(r,x.id);return{t:'¿En qué <b>nivel</b> está '+x.v+'?',mode:'num',focus:x.id,opts:range(0,H),ans:d,exp:'De la raíz a '+x.v+' hay '+d+' arista'+(d===1?'':'s')+': nivel '+d+'. La raíz es el nivel 0.'};},
  altura:()=>({t:'¿Cuál es la <b>altura</b> del árbol?',mode:'num',opts:range(1,H+1),ans:H,exp:'La hoja más profunda está en el nivel '+H+', así que la altura es '+H+'.'}),
  grado:()=>{const x=pick(all);const g=(x.l?1:0)+(x.r?1:0);return{t:'¿Cuál es el <b>grado</b> de '+x.v+'?',mode:'num',focus:x.id,opts:[0,1,2],ans:g,exp:x.v+' tiene '+g+' hijo'+(g===1?'':'s')+', entonces su grado es '+g+'.'};},
  cuantas:()=>({t:'¿Cuántas <b>hojas</b> tiene el árbol?',mode:'num',opts:range(Math.max(1,lv.length-2),lv.length+2),ans:lv.length,exp:'Hojas: '+lv.map(n=>n.v).join(', ')+'.'})
 };
 const keys=Object.keys(gens);
 for(let t=0;t<40;t++){const k=pick(keys);if(k===Q1.last)continue;const q=gens[k]();if(q){Q1.last=k;return q;}}

}

 if(Q1.count%3===0)Q1.root=randomBin(letters(7+rand(3)),3);

const Q3={mode:'ins'};

// Inserta
function n3Ins(){Q3.nums=distinct(7,10,99);UID++;Q3.root=N(Q3.nums[0]);Q3.i=1;Q3.err=0;Q3.done=false;n3Clear();n3InsDraw();
 fb($('#n3-fb'),'info','La primera matrícula, '+Q3.nums[0]+', ya es la raíz. Toca el lugar vacío (+) donde va la siguiente.');}
function n3InsDraw(newV){
 Q3.pos=drawTree($('#n3-svg'),layoutBin(Q3.root,!Q3.done),{dx:44,onClick:Q3.done?null:n3InsClick});
 if(newV!=null)T.pre(Q3.root).forEach(n=>{if(n.v===newV)mark(Q3.pos,n.id,'sel');});
 $('#n3-meta').textContent='Inserta · Matrícula '+Math.min(Q3.i+1,Q3.nums.length)+' de '+Q3.nums.length+' · Errores '+Q3.err;
 $('#n3-q').innerHTML=Q3.done?'Árbol terminado.':'Inserta la matrícula <span class="big">'+Q3.nums[Q3.i]+'</span>';
 const rest=Q3.nums.slice(Q3.i+1);$('#n3-queue').innerHTML=rest.length&&!Q3.done?'<b class="meta" style="align-self:center">Después vienen:</b>'+rest.map(v=>'<span>'+v+'</span>').join(''):'';
}
function n3InsClick(it){
 if(Q3.mode!=='ins'||Q3.done)return;
 if(!it.ghost){fb($('#n3-fb'),'info','Los nodos ya están ocupados. Toca un lugar vacío (+).');return;}
 const v=Q3.nums[Q3.i],s=bstSlot(Q3.root,v),path=bstPath(Q3.root,v).path;
 if(it.parent===s.p&&it.side===s.side){
  s.p[s.side]=N(v);Q3.i++;const lines=path.map(n=>cmpLine(v,n)).join(' · ');
  if(Q3.i>=Q3.nums.length){Q3.done=true;n3InsDraw(v);const p=Math.max(5,30-5*Q3.err);addPts('n3',p);
   fb($('#n3-fb'),'ok','Insertaste las '+Q3.nums.length+' matrículas. +'+p+' puntos. Mira el inorden: <code>'+seqStr(T.ino(Q3.root))+'</code>. Sale ordenado, como debe pasar en todo ABB.');
   nextBtn($('#n3-next'),'Nuevas matrículas',n3Ins);}
  else{n3InsDraw(v);fb($('#n3-fb'),'ok',lines+' · lugar vacío.');}
 }else{flash(Q3.pos,it.id);Q3.err++;$('#n3-meta').textContent='Inserta · Matrícula '+(Q3.i+1)+' de '+Q3.nums.length+' · Errores '+Q3.err;
  const r=Q3.root;let h='Empieza en la raíz: '+cmpLine(v,r)+'.';if(Q3.err>=2)h='Camino completo: '+path.map(n=>cmpLine(v,n)).join(' · ')+' · ahí queda el lugar vacío.';fb($('#n3-fb'),'bad',h);}
}
// Busca
function n3Bus(){const arr=distinct(10,1,99);Q3.arr=arr;Q3.root=buildBST(arr);const present=Math.random()<0.7;let t;if(present)t=pick(arr);else{do{t=1+rand(99);}while(arr.indexOf(t)>=0);}
 Q3.target=t;const r=bstPath(Q3.root,t);Q3.path=r.path;Q3.found=r.found;Q3.idx=0;Q3.err=0;Q3.done=false;n3Clear();
 Q3.pos=drawTree($('#n3-svg'),layoutBin(Q3.root),{dx:46,onClick:n3BusClick});
 $('#n3-meta').textContent='Busca · Comparaciones 0';
 $('#n3-q').innerHTML='Busca la matrícula <span class="big">'+t+'</span>. Toca el camino desde la raíz. Si te quedas sin lugar a dónde bajar, presiona <b>No está</b>.';
 $('#n3-ctrl').appendChild(btn('No está','btn ghost',n3NoEsta));}
function n3BusClick(it){
 if(Q3.mode!=='bus'||Q3.done)return;const t=Q3.target;
 if(it.g.classList.contains('hit')){fb($('#n3-fb'),'info','Ya comparaste con '+it.label+'. Sigue bajando.');return;}
 if(Q3.idx>=Q3.path.length){flash(Q3.pos,it.id);Q3.err++;fb($('#n3-fb'),'bad','Desde '+Q3.path[Q3.path.length-1].v+' ya no hay a dónde bajar: ese lado está vacío. Presiona No está.');return;}
 const exp=Q3.path[Q3.idx];
 if(it.id===exp.id){mark(Q3.pos,it.id,'hit');edgeHit(Q3.pos,it.id);Q3.idx++;$('#n3-meta').textContent='Busca · Comparaciones '+Q3.idx;
  if(exp.v===t)n3Win();else{const nx=t<exp.v?exp.l:exp.r;fb($('#n3-fb'),'info',cmpLine(t,exp)+(nx?'':' · ese lado está vacío.'));}}
 else{flash(Q3.pos,it.id);Q3.err++;fb($('#n3-fb'),'bad',Q3.idx===0?'Toda búsqueda empieza por la raíz: '+Q3.root.v+'.':'Compara '+t+' con '+Q3.path[Q3.idx-1].v+': '+cmpLine(t,Q3.path[Q3.idx-1])+'.');}
}
function n3NoEsta(){if(Q3.done)return;if(!Q3.found&&Q3.idx===Q3.path.length){n3Win();return;}Q3.err++;fb($('#n3-fb'),'bad',Q3.idx===0?'Primero compara con la raíz.':'Todavía puedes bajar: '+cmpLine(Q3.target,Q3.path[Q3.idx-1])+'.');}
function n3Win(){Q3.done=true;const p=Math.max(5,15-5*Q3.err);addPts('n3',p);const n=Q3.arr.length,c=Q3.path.length;
 fb($('#n3-fb'),'ok',(Q3.found?'Encontraste la matrícula '+Q3.target+'.':'Correcto: la matrícula '+Q3.target+' no está.')+' Hiciste '+c+' comparaciones. En una lista sin orden de '+n+' matrículas '+(Q3.found?'podrías necesitar hasta '+n:'tendrías que revisar las '+n+' para estar seguro')+'. +'+p+' puntos.');
 nextBtn($('#n3-next'),'Otra búsqueda',n3Bus);}
// ¿Es ABB?
function corrupt(root){const all=T.pre(root).filter(n=>n!==root),par=T.parents(root),vals=T.pre(root).map(n=>n.v);
 for(let t=0;t<80;t++){const x=pick(all);const anc=[];let p=par[x.id];while(p){anc.push(p);p=par[p.id];}if(anc.length<2)continue;
  const a=pick(anc.slice(1)),inLeft=x.v<a.v,nv=inLeft?a.v+1+rand(6):a.v-1-rand(6);if(nv<1||nv>99||vals.indexOf(nv)>=0)continue;
  const dp=anc[0];if(dp.l===x?nv>=dp.v:nv<=dp.v)continue;if(x.l&&x.l.v>=nv)continue;if(x.r&&x.r.v<=nv)continue;x.v=nv;return;}
 const a=pick(all),b=pick(all);if(a!==b){const tv=a.v;a.v=b.v;b.v=tv;}}
function n3Chk(){const root=buildBST(distinct(8,10,99));if(Math.random()<0.6)corrupt(root);Q3.root=root;Q3.bad=checkBST(root);Q3.done=false;n3Clear();
 Q3.pos=drawTree($('#n3-svg'),layoutBin(root),{dx:46});
 $('#n3-meta').textContent='¿Es un ABB?';$('#n3-q').innerHTML='Un compañero armó este árbol a mano. ¿Cumple la regla del ABB en <b>todos</b> sus nodos?';
 const c=$('#n3-ctrl');[['Sí, es un ABB',true],['No, tiene un error',false]].forEach(o=>c.appendChild(btn(o[0],'opt',function(){if(Q3.done)return;Q3.done=true;$$('.opt',c).forEach(b=>b.disabled=true);
  const valid=!Q3.bad,ok=o[1]===valid;this.classList.add(ok?'right':'wrongopt');let m;
  if(valid)m='Es un ABB: en cada nodo, todo lo de la izquierda es menor y todo lo de la derecha, mayor. Comprobación rápida, el inorden sale ordenado: <code>'+seqStr(T.ino(root))+'</code>.';
  else{mark(Q3.pos,Q3.bad.n.id,'wrong');mark(Q3.pos,Q3.bad.a.id,'cur');m='El '+Q3.bad.n.v+' está en el subárbol '+Q3.bad.dir+' de '+Q3.bad.a.v+' (borde punteado), pero es '+(Q3.bad.dir==='izquierdo'?'mayor':'menor')+' que '+Q3.bad.a.v+'. Con su padre directo puede parecer bien, pero la regla vale para todo el subárbol. El inorden lo delata: <code>'+seqStr(T.ino(root))+'</code> no está ordenado.';}
  if(ok)addPts('n3',10);fb($('#n3-fb'),ok?'ok':'bad',m);nextBtn($('#n3-next'),'Otro árbol',n3Chk);})));}
segInit($('#n3-modes'),'mode',m=>{Q3.mode=m;({ins:n3Ins,bus:n3Bus,chk:n3Chk})[m]();});

 if(st&&st.type==='tap'&&!C4.stepDone)o.onClick=caseTap;
 C4.pos=drawTree($('#n4-svg'),items,o);}
function caseStep(){const st=C4.steps[C4.si];C4.first=true;C4.tries=0;C4.tapIdx=0;C4.stepDone=false;
 caseDraw();$('#n4-fb').innerHTML='';$('#n4-next').innerHTML='';$('#n4-strip').innerHTML='';
 $('#n4-meta').textContent=C4.c.title+' · Paso '+(C4.si+1)+' de '+C4.steps.length;$('#n4-q').innerHTML=st.q;
 const ctrl=$('#n4-ctrl');ctrl.innerHTML='';
 if(st.type==='mc'){st.opts.forEach((t,i)=>ctrl.appendChild(btn(t,'opt',function(){if(C4.stepDone)return;if(i===st.ans){this.classList.add('right');$$('.opt',ctrl).forEach(b=>b.disabled=true);caseOk(st.exp);}else{this.classList.add('wrongopt');this.disabled=true;caseBad(st);}})));}
 else if(st.type==='num'){const row=document.createElement('div');row.className='row';const id='n4-in-'+C4.c.id+'-'+C4.si;row.innerHTML='<label for="'+id+'">Respuesta</label><input type="text" inputmode="numeric" id="'+id+'" autocomplete="off">';
  const inp=row.querySelector('input');const go=()=>{if(C4.stepDone)return;const v=Number(inp.value.replace(/\s|\./g,'').replace(',','.'));if(inp.value.trim()===''||isNaN(v)){fb($('#n4-fb'),'info','Escribe un número.');return;}if(v===st.ans){inp.disabled=true;caseOk(st.exp);}else caseBad(st);};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});row.appendChild(btn('Comprobar','btn',go));ctrl.appendChild(row);}
 else if(st.type==='tap'){strip($('#n4-strip'),st.order.length);}
}
function caseTap(it){const st=C4.steps[C4.si];if(st.type!=='tap'||C4.stepDone)return;const exp=st.order[C4.tapIdx];
 if(it.id===exp.id){mark(C4.pos,it.id,'hit');badge(C4.pos,it.id,C4.tapIdx+1);if(C4.tapIdx>0)edgeHit(C4.pos,it.id);stripSet($('#n4-strip'),C4.tapIdx,it.label.replace('\n',' '));unmarkAll(C4.pos,'cur');C4.tapIdx++;$('#n4-fb').innerHTML='';
  if(C4.tapIdx===st.order.length)caseOk('Secuencia: <code>'+st.order.map(n=>String(n.v).replace('\n',' ')).join(' · ')+'</code>');}
 else if(it.g.classList.contains('hit')){fb($('#n4-fb'),'info','Ese ya lo tocaste.');}
 else{flash(C4.pos,it.id);C4.first=false;C4.tries++;let h=st.hint;if(C4.tries>=2){mark(C4.pos,exp.id,'cur');h+=' Te marqué el siguiente con borde punteado.';}fb($('#n4-fb'),'bad',h);}}
function caseOk(exp){C4.stepDone=true;if(C4.first){C4.correct++;addPts('n4',10);}fb($('#n4-fb'),'ok',exp);
 if(C4.steps[C4.si].type==='tap')caseDrawKeep();
 const last=C4.si===C4.steps.length-1;nextBtn($('#n4-next'),last?'Terminar caso':'Siguiente paso',()=>{if(last)caseEnd();else{C4.si++;caseStep();}});}
function caseDrawKeep(){$$('.node.clickable',$('#n4-svg')).forEach(g=>{g.classList.remove('clickable');g.removeAttribute('tabindex');});}
function caseBad(st){C4.first=false;C4.tries++;
 if(C4.tries>=2&&st.type!=='tap'){C4.stepDone=true;let ans=st.type==='mc'?st.opts[st.ans]:st.ans;$$('#n4-ctrl .opt').forEach((b,i)=>{b.disabled=true;if(i===st.ans)b.classList.add('right');});$$('#n4-ctrl input').forEach(i=>i.disabled=true);
  fb($('#n4-fb'),'bad','La respuesta es <b>'+ans+'</b>. '+st.exp);const last=C4.si===C4.steps.length-1;nextBtn($('#n4-next'),last?'Terminar caso':'Siguiente paso',()=>{if(last)caseEnd();else{C4.si++;caseStep();}});}
 else fb($('#n4-fb'),'bad','Piénsalo otra vez. Tienes un intento más antes de ver la respuesta.');}
function caseEnd(){const c=C4.c,n=C4.steps.length;if(doneCases.indexOf(c.id)<0){doneCases.push(c.id);store.set('cases',doneCases);}renderCasePicker();
 $('#n4-meta').textContent=c.title+' · Terminado';$('#n4-q').innerHTML='Acertaste <span class="big">'+C4.correct+'</span> de '+n+' pasos al primer intento.';$('#n4-ctrl').innerHTML='';$('#n4-strip').innerHTML='';
 const idx=CASES.indexOf(c),nx=CASES[idx+1];
 $('#n4-fb').innerHTML=sayHTML('techi',nx?'Siguiente caso: '+nx.title+'.':'Terminaste los cinco casos. Te queda el desafío del Nivel 5.');
 const box=$('#n4-next');box.innerHTML='';box.appendChild(btn('Repetir este caso','btn ghost',()=>caseStart(c)));if(nx){const b=btn('Ir al siguiente caso','btn',()=>caseStart(nx));box.appendChild(b);b.focus({preventScroll:true});}}

/* ================= N5 · Desafío ================= */
const Q5={rounds:0,ok:0,done:false};
function n5New(){
 const labs=letters(6+rand(2));const right=randomBin(labs,3);const sigOf=t=>seqStr(T.pre(t))+'|'+seqStr(T.ino(t));const rs=sigOf(right);
 const opts=[right];const seen=new Set([rs]);
 // un distractor con el mismo preorden (más tramposo), si aparece
 for(let t=0;t<400&&opts.length<2;t++){const cand=randomBin(labs,3);const s=sigOf(cand);if(!seen.has(s)&&seqStr(T.pre(cand))===seqStr(T.pre(right))){seen.add(s);opts.push(cand);}}
 for(let t=0;t<400&&opts.length<3;t++){const cand=randomBin(t%2?labs:shuffle(labs),3);const s=sigOf(cand);if(!seen.has(s)){seen.add(s);opts.push(cand);}}
 Q5.right=right;Q5.done=false;Q5.rounds++;
 const pre=T.pre(right).map(n=>n.v),ino=T.ino(right).map(n=>n.v);$('#n5-pre').textContent=pre.join(' ');$('#n5-in').textContent=ino.join(' ');
 $('#n5-meta').textContent='Ronda '+Q5.rounds+' · Aciertos '+Q5.ok;$('#n5-fb').innerHTML='';$('#n5-next').innerHTML='';
 const box=$('#n5-opts');box.innerHTML='';
 shuffle(opts).forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.setAttribute('aria-label','Árbol '+'ABC'[i]);
  b.innerHTML='<span>Árbol '+'ABC'[i]+'</span>';const s=sv('svg',{'class':'tree'});b.appendChild(s);box.appendChild(b);drawTree(s,layoutBin(t),{r:15,dx:34,dy:46,scale:1});
  b.addEventListener('click',()=>{if(Q5.done)return;Q5.done=true;const ok=t===right;$$('.choice',box).forEach(x=>x.disabled=true);b.classList.add(ok?'right':'wrongopt');
   $$('.choice',box).forEach(x=>{if(x._tree===right)x.classList.add('right');});
   const k=ino.indexOf(pre[0]),L=ino.slice(0,k),R=ino.slice(k+1);
   const ex='La raíz es <b>'+pre[0]+'</b> (la primera del preorden). En el inorden, a su izquierda quedan <code>'+(L.join(' ')||'nada')+'</code> → subárbol izquierdo; a su derecha <code>'+(R.join(' ')||'nada')+'</code> → subárbol derecho. Repite lo mismo dentro de cada lado.'+(ok?'':' Para comprobar un árbol, escribe su preorden y su inorden y compáralos con los de arriba.');
   if(ok){Q5.ok++;addPts('n5',20);}fb($('#n5-fb'),ok?'ok':'bad',ex);$('#n5-meta').textContent='Ronda '+Q5.rounds+' · Aciertos '+Q5.ok;nextBtn($('#n5-next'),'Otro árbol',n5New);});
  b._tree=t;});
}

/* ================= navegación ================= */
const VIEWS=['teoria','n1','n2','n3','n4','n5'];
const inits={n1:n1Start,n2:n2Orden,n3:n3Ins,n4:()=>caseStart(CASES[0]),n5:n5New};const inited={};
function show(v,fromClick){if(VIEWS.indexOf(v)<0)v='teoria';
 VIEWS.forEach(x=>{$('#v-'+x).hidden=x!==v;$('#tab-'+x).setAttribute('aria-selected',String(x===v));});
 if(inits[v]&&!inited[v]){inited[v]=true;inits[v]();}
 const t=$('#tab-'+v);if(t&&t.scrollIntoView)t.scrollIntoView({block:'nearest',inline:'nearest'});
 if(fromClick)window.scrollTo({top:Math.max(0,HOST.getBoundingClientRect().top+window.scrollY-70),behavior:RM?'auto':'smooth'});}
$$('.tab').forEach(t=>t.addEventListener('click',()=>{const v=t.dataset.view;if(location.hash!=='#'+v)location.hash=v;else show(v,true);}));
window.addEventListener('hashchange',()=>show(location.hash.slice(1),true));
show(location.hash.slice(1),false);
})();
</script>
