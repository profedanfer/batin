   exp:'Línea 5: el return está dentro del for (tiene más sangría). Se ejecuta en la 1ra vuelta y termina la función. Debe ir al nivel del for, fuera del ciclo.', who:'gatiel'},

  {t:'line', q:'Este código da error. Toca la línea con el método equivocado.', code:
`monedas = []
monedas.add(5)
monedas.append(10)
print(len(monedas))`,
   bad:2, hint:'Uno de los métodos no existe para las listas.',
   exp:'Línea 2: las listas no tienen .add(). Para agregar al final se usa .append().'},

  {t:'mc', q:'Esta función devuelve None. ¿Cuál es la corrección?', code:
`def calcular_total(lista):
    total = 0
    for x in lista:
        total = total + x

print(calcular_total([1, 2, 3]))`,
   opts:[{x:'Agregar print(total) dentro del for',fb:'Así se mostrarían los valores parciales, pero la función seguiría devolviendo None.'},{x:'Agregar return total dentro del for',fb:'Así la función terminaría en la 1ra vuelta y devolvería 1.'},{x:'Agregar return total después del for',ok:1},{x:'Cambiar total = 0 por total = None',fb:'Así no se podría sumar: None + 1 da error.'}],
   hint:'La función calcula bien, pero no entrega nada. ¿Dónde debería entregar el resultado?',

]}
];

/* ===================== ESTADO ===================== */
const KEY = 'batin2-mision-depuracion-v1';
let S = load() || { nombre:'', res:{}, pistas:0, xp:0, fallados:[], revancha:null };
let cur = null; // {mid, i, list, mode, answered, hintUsed, picks}

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => String(s).toLowerCase().replace(/[\s"'`]/g,'').replace(/\.0$/,'');
const MASC = { bit:['🤖','Bit'], gatiel:['🦊','Gatiel'], techi:['👩‍💻','Techi'] };
const findReto = key => { const [m,i] = key.split(':'); return MISIONES.find(x=>x.id===m).retos[+i]; };

/* Resaltado simple de Python */
function hl(line){
  const re = /(#.*$)|("[^"]*"|'[^']*')|\b(def|return|if|elif|else|for|in|while|and|or|not|None|True|False|global)\b|\b(print|len|str|int|range|update|draw)\b(?=\()|\b(\d+)\b|(_{3,})/g;
  let out='', last=0, m;
  while((m = re.exec(line))){
    out += esc(line.slice(last, m.index));
    const t = esc(m[0]);
    out += m[1]?`<span class="c">${t}</span>`:m[2]?`<span class="s">${t}</span>`:m[3]?`<span class="k">${t}</span>`:m[4]?`<span class="f">${t}</span>`:m[5]?`<span class="nm">${t}</span>`:`<span class="blank">${t}</span>`;
    last = re.lastIndex;
  }
  return out + esc(line.slice(last));
}
function codeBlock(code, clickable){
  const lines = code.split('\n');
  return `<div class="code" role="${clickable?'group':'region'}" aria-label="Código">` + lines.map((l,i)=>
    clickable ? `<button class="ln" data-line="${i+1}"><span class="n">${i+1}</span><span>${hl(l)||' '}</span></button>`
              : `<div class="ln"><span class="n">${i+1}</span><span>${hl(l)||' '}</span></div>`).join('') + `</div>`;
}

/* ===================== PANTALLAS ===================== */
function totalRetos(){ return MISIONES.reduce((s,m)=>s+m.retos.length,0); }
function topBar(){
  return `<div class="top"><a class="volver" href="../../aprendiendo.html#programacion">← Sitio BATIN</a><span class="eyebrow">2do BATIN · Práctica</span><span class="chip">XP <b>${S.xp}</b></span></div>`;
}

function home(){
  cur = null;
  if(!S.nombre){
    $app.innerHTML = `${topBar()}
    <section class="hero">
      <div class="prompt">&gt;&gt;&gt; iniciar mision_depuracion.py</div>
      <h1>Misión <span class="acc">Depuración</span> BIT</h1>
      <p class="muted">Después de la prueba, toca reforzar. Son 6 misiones cortas sobre los temas que más costaron. Cada error trae una explicación de por qué pasó, así que equivocarse también suma.</p>
    </section>
    <div class="cast">
      <div><b>🤖 Bit</b>Te explica qué hace cada línea de código.</div>
      <div><b>🦊 Gatiel</b>Te avisa cuando una respuesta parece correcta pero es una trampa.</div>
      <div><b>👩‍💻 Techi</b>Te acompaña al cerrar cada misión.</div>
    </div>
    <form class="card" id="f-nombre">
      <label for="nombre" class="q">¿Cómo te llamas?</label>
      <div class="namebox"><input type="text" id="nombre" autocomplete="name" placeholder="Nombre y apellido" required><button class="btn">Empezar</button></div>
      <p class="small muted">Tu nombre aparece en el código de resultados que vas a entregar al final.</p>
    </form>`;
    document.getElementById('f-nombre').onsubmit = e => { e.preventDefault(); const v = document.getElementById('nombre').value.trim(); if(!v) return; S.nombre = v; save(); home(); };
    return;
  }
  const hechas = MISIONES.filter(m=>S.res[m.id]).length;
  const pend = S.fallados.length;
  $app.innerHTML = `${topBar()}
  <section class="hero">
    <div class="prompt">&gt;&gt;&gt; hola, ${esc(S.nombre.split(' ')[0])}</div>
    <h1>Elige tu <span class="acc">misión</span></h1>
    <p class="muted">Empieza por las de <span class="tag crit" style="margin:0">zona crítica</span>: son los temas con menos aciertos en la prueba. Puedes hacerlas en cualquier orden.</p>
  </section>
  <div class="missions">
    ${MISIONES.map(m=>{ const r = S.res[m.id]; const pct = r? Math.round(100*r.ok/r.n):0;
      return `<button class="mission" data-m="${m.id}">
        <span class="ico" aria-hidden="true">${m.ico}</span>
        <span><span class="t">${esc(m.titulo)}</span>${m.crit?'<span class="tag crit">zona crítica</span>':''}${r?'<span class="tag done">hecha</span>':''}
          <span class="d" style="display:block">${esc(m.desc)}</span>
          ${r?`<span class="bar"><i style="width:${pct}%"></i></span>`:''}</span>
        <span class="s">${r?`${r.ok}/${r.n}`:`${m.retos.length} retos`}</span></button>`;}).join('')}
    <button class="mission revancha" id="rev" ${pend?'':'disabled'}>
      <span class="ico" aria-hidden="true">🔁</span>
      <span><span class="t">Revancha</span><span class="d" style="display:block">${pend?`Vuelve a intentar los ${pend} retos que fallaste.`:'Aquí aparecen los retos que falles, para intentarlos de nuevo.'}</span></span>
      <span class="s">${pend}</span></button>
  </div>
  <div class="actions" style="justify-content:space-between">
    <button class="btn ghost" id="reset">Empezar de cero</button>
    <button class="btn" id="fin" ${hechas===MISIONES.length?'':'disabled'}>Ver resultados (${hechas}/${MISIONES.length})</button>
  </div>
  <div id="confirm"></div>
  <footer>Prof. Daniela Ferreira · CED Miguela Rodríguez · Algorítmica + Laboratorio</footer>`;
  $app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m));
  document.getElementById('rev').onclick = ()=> pend && startRevancha();
  document.getElementById('fin').onclick = ()=> results();
  document.getElementById('reset').onclick = ()=>{
    document.getElementById('confirm').innerHTML = `<div class="card"><p>¿Borrar todo tu progreso en este dispositivo?</p><div class="actions"><button class="btn ghost" id="no">Cancelar</button><button class="btn" id="si">Sí, borrar</button></div></div>`;
    document.getElementById('no').onclick = ()=> document.getElementById('confirm').innerHTML='';
    document.getElementById('si').onclick = ()=>{ S = { nombre:'', res:{}, pistas:0, xp:0, fallados:[], revancha:null }; save(); home(); };
  };
  window.scrollTo(0,0);
}

function start(mid){
  const m = MISIONES.find(x=>x.id===mid);
  cur = { mid, titulo:m.titulo, list: m.retos.map((_,i)=>`${mid}:${i}`), i:0, ok:0, marks:[], mode:'mision' };
  question();
}
function startRevancha(){
  cur = { mid:'rev', titulo:'Revancha', list: shuffle(S.fallados), i:0, ok:0, marks:[], mode:'revancha' };
  question();
}

function question(){
  const key = cur.list[cur.i], r = findReto(key);
  cur.answered = false; cur.hintUsed = false; cur.picks = new Set(); cur.line = null;
  cur.order = (r.t==='mc'||r.t==='multi') ? shuffle(r.opts.map((o,i)=>i)) : null;
  const dots = cur.list.map((_,i)=>`<i class="${i<cur.i?(cur.marks[i]?'ok':'no'):i===cur.i?'cur':''}"></i>`).join('');
  let input = '';
  if(r.t==='mc'||r.t==='multi'){
    input = `<div class="opts">${cur.order.map((oi,k)=>`<button class="opt ${r.t==='multi'?'box':''}" data-o="${oi}"><span class="l">${r.t==='multi'?'':String.fromCharCode(65+k)+')'}</span><span class="x">${esc(r.opts[oi].x)}</span></button>`).join('')}</div>`;
  } else if(r.t==='in'){
    input = `<div class="namebox"><input type="text" id="resp" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${r.num?'numeric':'text'}" placeholder="Escribe tu respuesta"></div>`;
  } else if(r.t==='trace'){
    input = `<div class="fields">${r.fields.map((f,k)=>`<div class="field"><label for="tr${k}">${esc(f.l)}</label><input type="text" id="tr${k}" inputmode="numeric" autocomplete="off"></div>`).join('')}</div>`;
  }
  $app.innerHTML = `${topBar()}
  <div class="qhead"><h2>${esc(cur.titulo)}</h2><span class="chip">${cur.i+1} / ${cur.list.length}</span></div>
  <div class="dots" aria-hidden="true">${dots}</div>
  <section class="card" aria-live="polite">
    <p class="q">${esc(r.q)}</p>
    ${r.code? codeBlock(r.code, r.t==='line') : ''}
    ${input}
    <details class="hint" id="hint"><summary>¿Por dónde empiezo?</summary><p>${esc(r.hint)}</p></details>
    <div class="actions"><button class="btn ghost" id="salir">Volver al mapa</button><button class="btn" id="ok" ${r.t==='in'||r.t==='trace'?'':'disabled'}>Comprobar</button></div>
  </section>
  <div id="fb"></div>`;
  const okBtn = document.getElementById('ok');
  document.getElementById('hint').addEventListener('toggle', e=>{ if(e.target.open && !cur.answered && !cur.hintUsed){ cur.hintUsed = true; S.pistas++; save(); }});
  document.getElementById('salir').onclick = home;
  if(r.t==='mc') $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(cur.answered) return; $app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); cur.picks=new Set([+b.dataset.o]); okBtn.disabled=false; });
  if(r.t==='multi') $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(cur.answered) return; const o=+b.dataset.o; cur.picks.has(o)?cur.picks.delete(o):cur.picks.add(o); b.classList.toggle('sel'); okBtn.disabled = cur.picks.size===0; });
  if(r.t==='line') $app.querySelectorAll('button.ln').forEach(b=>b.onclick=()=>{ if(cur.answered) return; $app.querySelectorAll('button.ln').forEach(x=>x.classList.remove('pick')); b.classList.add('pick'); cur.line=+b.dataset.line; okBtn.disabled=false; });
  if(r.t==='in'){ const inp=document.getElementById('resp'); inp.focus({preventScroll:true}); inp.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); }); }
  okBtn.onclick = check;
  window.scrollTo(0,0);
}

function check(){
  if(cur.answered) return;
  const key = cur.list[cur.i], r = findReto(key);
  let ok = false, specific = '';
  if(r.t==='mc'){
    const o = [...cur.picks][0]; if(o===undefined) return;
    ok = !!r.opts[o].ok; specific = ok? '' : r.opts[o].fb;
    $app.querySelectorAll('.opt').forEach(b=>{ const oi=+b.dataset.o; b.disabled=true; if(r.opts[oi].ok) b.classList.add('right'); else if(oi===o) b.classList.add('wrong'); });
  } else if(r.t==='multi'){
    const correctas = r.opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0);
    const malas = [...cur.picks].filter(i=>!r.opts[i].ok).length;
    const faltan = correctas.filter(i=>!cur.picks.has(i)).length;
    ok = malas===0 && faltan===0;
    if(!ok){
      const p=[];
      if(faltan) p.push(`te faltó marcar ${faltan} opción${faltan>1?'es':''} correcta${faltan>1?'s':''}`);
      if(malas) p.push(`marcaste ${malas} opción${malas>1?'es':''} falsa${malas>1?'s':''}`);
      specific = 'Casi: ' + p.join(' y ') + '. En las preguntas de "marca TODAS" el punto se gana solo con la selección completa.';
    }
    $app.querySelectorAll('.opt').forEach(b=>{ const oi=+b.dataset.o; b.disabled=true; if(r.opts[oi].ok) b.classList.add('right'); else if(cur.picks.has(oi)) b.classList.add('wrong'); });
  } else if(r.t==='in'){
    const v = document.getElementById('resp').value; if(!v.trim()) return;
    ok = r.ans.some(a=>norm(a)===norm(v));
    if(!ok){ specific = (r.wrong && r.wrong[norm(v)]) || `Escribiste "${v.trim()}". La respuesta esperada es: ${r.ans[0].replace('+',' + ')}.`; }
    const inp = document.getElementById('resp'); inp.disabled = true; inp.style.borderColor = ok?'var(--ok)':'var(--bad)';
  } else if(r.t==='trace'){
    const vals = r.fields.map((f,k)=>document.getElementById('tr'+k).value);
    if(vals.some(v=>!v.trim())) { document.getElementById('fb').innerHTML = `<p class="small" style="color:var(--warn)">Completa todos los casilleros antes de comprobar.</p>`; return; }
    let bien = 0;
    r.fields.forEach((f,k)=>{ const inp=document.getElementById('tr'+k); const g = norm(vals[k])===norm(f.a); bien+=g; inp.classList.add(g?'ok':'no'); inp.disabled=true; if(!g) inp.value = `${vals[k].trim()} → ${f.a}`; });
    ok = bien===r.fields.length;
    if(!ok) specific = `Acertaste ${bien} de ${r.fields.length} valores. Los correctos quedaron escritos al lado de tu respuesta.`;
  } else if(r.t==='line'){
    if(cur.line===null) return;
    ok = cur.line===r.bad;
    $app.querySelectorAll('button.ln').forEach(b=>{ const n=+b.dataset.line; b.disabled=true; if(n===r.bad) b.classList.add('right'); else if(n===cur.line) b.classList.add('wrong'); });
    if(!ok) specific = `Tocaste la línea ${cur.line}, pero esa línea es correcta. El problema está en la línea ${r.bad}.`;
  }
  cur.answered = true; cur.marks[cur.i] = ok; if(ok) cur.ok++;
  const gain = ok ? (cur.hintUsed? 6 : 10) * (cur.mode==='revancha'? .5 : 1) : 0;
  S.xp += gain;
  const chipXP = $app.querySelector('.top .chip b'); if(chipXP) chipXP.textContent = S.xp;
  if(cur.mode==='mision'){
    if(!ok && !S.fallados.includes(key)) S.fallados.push(key);
  } else {
    if(ok) S.fallados = S.fallados.filter(k=>k!==key);
    S.revancha = S.revancha || {intentos:0, recuperados:0};
    S.revancha.intentos++; if(ok) S.revancha.recuperados++;
  }
  save();
  const who = ok ? (cur.hintUsed? 'bit' : 'techi') : (r.who || 'bit');
  const [emo, nom] = MASC[who];
  const ttl = ok ? (cur.hintUsed? `Correcto con pista · +${gain} XP` : `¡Correcto! · +${gain} XP`) : 'Todavía no';
  const ultimo = cur.i === cur.list.length-1;
  document.getElementById('fb').innerHTML = `
  <div class="fb ${ok?'ok':'no'}"><span class="who" aria-hidden="true">${emo}</span>
    <div class="body"><span class="ttl">${nom} · ${ttl}</span>
      ${specific?`<p>${esc(specific)}</p>`:''}
      <p>${esc(r.exp)}</p>
      ${!ok && cur.mode==='mision'?'<p class="small muted">Este reto se guardó en tu Revancha.</p>':''}
    </div></div>
  <div class="actions" style="margin-top:12px"><button class="btn" id="next">${ultimo?'Terminar misión':'Siguiente'}</button></div>`;
  const ok2 = document.getElementById('ok'); ok2.disabled = true;
  const nx = document.getElementById('next'); nx.onclick = next; nx.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'});
}

function next(){
  if(cur.i < cur.list.length-1){ cur.i++; question(); return; }
  if(cur.mode==='mision'){
    const prev = S.res[cur.mid];
    if(!prev || cur.ok > prev.ok) S.res[cur.mid] = { ok:cur.ok, n:cur.list.length, primera: prev? prev.primera : cur.ok };
    save();
  }
  missionEnd();
}

function missionEnd(){
  const pct = Math.round(100*cur.ok/cur.list.length);
  const msg = cur.mode==='revancha'
    ? (cur.ok===cur.list.length? 'Recuperaste todos los retos pendientes. Eso es aprender del error.' : `Recuperaste ${cur.ok}. Los que quedan siguen en tu Revancha: relee la explicación antes de volver a intentarlo.`)
    : pct>=80 ? 'Muy bien. Este tema ya lo manejas: en el proyecto vas a usarlo todo el tiempo.'
    : pct>=50 ? 'Vas bien. Repasa los que fallaste en la Revancha y vuelve a intentarlo.'
    : 'Este tema todavía cuesta, y está bien: para eso es la práctica. Lee las explicaciones con calma y prueba el código en Pydroid 3.';
  $app.innerHTML = `${topBar()}
  <section class="hero"><div class="prompt">&gt;&gt;&gt; mision_terminada()</div><h1>${esc(cur.titulo)}</h1></section>
  <div class="stats"><div class="stat"><b>${cur.ok}/${cur.list.length}</b><span>aciertos</span></div><div class="stat"><b>${pct}%</b><span>logro</span></div><div class="stat"><b>${S.xp}</b><span>XP total</span></div></div>
  <div class="fb ok" style="background:var(--panel);border-color:var(--line)"><span class="who" aria-hidden="true">👩‍💻</span><div class="body"><span class="ttl" style="color:var(--violet)">Techi</span><p>${msg}</p></div></div>
  <div class="actions"><button class="btn" id="mapa">Volver al mapa</button></div>`;
  document.getElementById('mapa').onclick = home;
  window.scrollTo(0,0);
}

function results(){
  const filas = MISIONES.map(m=>{ const r=S.res[m.id]; return {m, r}; });
  const okT = filas.reduce((s,x)=>s+(x.r?x.r.primera:0),0);
  const tot = totalRetos();
  const rev = S.revancha || {intentos:0, recuperados:0};
  const codigo = `PRACT-2BATIN | ${S.nombre} | ` + filas.map((x,i)=>`M${i+1} ${x.r?x.r.primera:0}/${x.m.retos.length}`).join(' · ') +
    ` | 1er intento ${okT}/${tot} | Revancha ${rev.recuperados}/${rev.intentos} | Pistas ${S.pistas} | Pendientes ${S.fallados.length} | XP ${S.xp}`;
  $app.innerHTML = `${topBar()}
  <section class="hero"><div class="prompt">&gt;&gt;&gt; reporte_final()</div><h1>¡Misión <span class="acc">cumplida</span>!</h1>
  <p class="muted">${esc(S.nombre)}, este es tu resumen. Copia el código de abajo y entrégalo en Classroom.</p></section>
  <div class="stats"><div class="stat"><b>${okT}/${tot}</b><span>al 1er intento</span></div><div class="stat"><b>${rev.recuperados}</b><span>recuperados</span></div><div class="stat"><b>${S.pistas}</b><span>pistas usadas</span></div></div>
  <section class="card"><table class="res">${filas.map(x=>`<tr><td>${x.m.ico} ${esc(x.m.titulo)}</td><td>${x.r?x.r.primera:0}/${x.m.retos.length}</td></tr>`).join('')}</table></section>
  <section class="card"><span class="eyebrow">Código de resultados</span><div class="codeout" id="cod">${esc(codigo)}</div>
    <div class="actions"><span class="small muted" id="copiado" style="margin-right:auto;align-self:center"></span><button class="btn" id="copiar">Copiar código</button></div></section>
  ${S.fallados.length?`<p class="small muted">Te quedan ${S.fallados.length} retos en Revancha. Puedes seguir practicando: el código registra tu 1er intento y lo que recuperes.</p>`:''}
  <div class="actions"><button class="btn ghost" id="mapa">Volver al mapa</button></div>`;
  document.getElementById('mapa').onclick = home;
  document.getElementById('copiar').onclick = ()=>{
    const el = document.getElementById('copiado');
    const selectIt = ()=>{ const rg=document.createRange(); rg.selectNodeContents(document.getElementById('cod')); const s=getSelection(); s.removeAllRanges(); s.addRange(rg); el.textContent='Texto seleccionado: cópialo con el menú del celular.'; };
    try{ navigator.clipboard.writeText(codigo).then(()=>{ el.textContent='Copiado ✔'; }, selectIt); }catch(e){ selectIt(); }
  };
  window.scrollTo(0,0);
}

home();
</script>
